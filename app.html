<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAR Management Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
}

header {
    background: #17324d;
    color: white;
    padding: 25px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

.card {
    background: white;
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 12px;
}

input {
    margin-top: 15px;
}

button {
    margin-top: 20px;
    padding: 12px 20px;
    background: #17324d;
    color: white;
    border: 0;
    border-radius: 8px;
}
</style>

</head>

<body>

<header>
<h1>PAR Management & KPI Dashboard</h1>
<p>Dynamic PAR Management System</p>
</header>

<div class="container">

<div class="card">

<h2>Upload PAR Excel File</h2>

<p>Select your Omnicell PAR Excel file.</p>

<input type="file" accept=".xlsx,.xls">

<br>

<button>Start Analysis</button>

</div>

<div class="card">

<h2>Dashboard</h2>

<p>Availability: —</p>
<p>Total Medications: —</p>
<p>Problem Items: —</p>
<p>PAR Changes: —</p>

</div>

</div>

</body>
</html>
