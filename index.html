<header class="top">
  <div>
    <div class="eyebrow">PHARMACY AUTOMATION &amp; TECHNOLOGY</div>
    <h1>Medication Data Analysis</h1>
    <div class="subtitle">
      Select a quarter, upload its Excel report and view the analysis.
    </div>
  </div>
</header>

<section class="quarter-panel">
  <div class="section-title">Quarterly Analysis</div>
  <div class="section-subtitle">Select the quarter to analyze:</div>

  <div class="quarters">
    <button type="button" class="quarter-btn active" data-quarter="Q1">
      Q1 <small>January – March</small>
    </button>
    <button type="button" class="quarter-btn" data-quarter="Q2">
      Q2 <small>April – June</small>
    </button>
    <button type="button" class="quarter-btn" data-quarter="Q3">
      Q3 <small>July – September</small>
    </button>
    <button type="button" class="quarter-btn" data-quarter="Q4">
      Q4 <small>October – December</small>
    </button>
  </div>

  <div class="quarter-actions">
    <div>
      <div class="selected-quarter" id="selectedQuarter">Selected Quarter: Q1</div>
      <div class="section-subtitle" id="quarterFile">
        No file uploaded for this quarter.
      </div>
    </div>

    <div>
      <label for="excelFile" class="upload-btn" id="uploadLabel">
        ↑ &nbsp; Upload Q1 Excel
      </label>
      <input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm">
    </div>
  </div>

  <div id="fileStatus" class="file-status">
    Select a quarter and upload its Excel report to begin.
  </div>
  <div id="fileError" class="file-status error"></div>
</section>
